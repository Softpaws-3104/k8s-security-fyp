apiVersion: v1
kind: Pod
metadata:
  name: net-client
  namespace: k8s-net-hardened
  labels:
    app: net-client
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: client
      image: busybox:1.36.1
      command: ["sh", "-c", "sleep 3600"]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
---
apiVersion: v1
kind: Pod
metadata:
  name: net-server
  namespace: k8s-net-hardened
  labels:
    app: net-server
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: server
      image: busybox:1.36.1
      command: ["sh", "-c"]
      args:
        - mkdir -p /www && echo "Hardened Kubernetes networking test successful" > /www/index.html && httpd -f -p 8080 -h /www
      ports:
        - containerPort: 8080
          name: http
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      volumeMounts:
        - name: web-content
          mountPath: /www
  volumes:
    - name: web-content
      emptyDir: {}
---
apiVersion: v1
kind: Pod
metadata:
  name: unauthorized-client
  namespace: k8s-net-hardened
  labels:
    app: unauthorized-client
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: client
      image: busybox:1.36.1
      command: ["sh", "-c", "sleep 3600"]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
