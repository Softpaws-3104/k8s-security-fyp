apiVersion: v1
kind: Service
metadata:
  name: net-server
  namespace: k8s-net-hardened
spec:
  selector:
    app: net-server
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-server-ingress
  namespace: k8s-net-hardened
spec:
  podSelector:
    matchLabels:
      app: net-server
  policyTypes:
    - Ingress
  ingress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-client-to-server
  namespace: k8s-net-hardened
spec:
  podSelector:
    matchLabels:
      app: net-server
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: net-client
      ports:
        - protocol: TCP
          port: 8080
