- rule: Shell Spawned in Container
  desc: Detect shell processes started inside a container
  condition: >
    spawned_process and container
    and proc.name in (bash, sh, ash, dash, zsh)
  output: >
    Shell spawned inside container
    (user=%user.name command=%proc.cmdline
    container=%container.name image=%container.image.repository
    pod=%k8s.pod.name namespace=%k8s.ns.name)
  priority: WARNING
  tags: [container, process, shell, custom]

- rule: Package Manager Executed in Container
  desc: Detect package manager commands executed inside a container
  condition: >
    spawned_process and container
    and proc.name in (apt, apt-get, apk, yum, dnf, pip, pip3, dpkg, rpm)
  output: >
    Package manager executed inside container
    (user=%user.name command=%proc.cmdline
    container=%container.name image=%container.image.repository
    pod=%k8s.pod.name namespace=%k8s.ns.name)
  priority: WARNING
  tags: [container, process, package_management, custom]
